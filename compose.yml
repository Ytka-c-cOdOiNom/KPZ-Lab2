services:
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    networks:
      - app-net
    depends_on:
      - backend

  backend:
    build: ./backend
    environment:
      - POSTGRES_DB=appdb
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    networks:
      - app-net
    depends_on:
      - database

  database:
    image: postgres:latest
    environment:
      - POSTGRES_DB=appdb
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - app-net
    ports:
      - "5432:5432"

volumes:
  postgres_data:

networks:
  app-net:
    driver: bridge