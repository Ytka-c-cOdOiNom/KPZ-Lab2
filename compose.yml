
services:


  web:
    build: ./web_app
    ports:
      - "5000:5000"
    environment:
      - POSTGRES_DB=usersdb
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password

      - DB_HOST=db
    networks:
      - webnet
    depends_on:
      - db

  db:
    image: postgres:latest
    environment:
      - POSTGRES_DB=usersdb
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db_init:/docker-entrypoint-initdb.d
    networks:
      - webnet

networks:
  webnet:
    driver: bridge

volumes:
  postgres_data: